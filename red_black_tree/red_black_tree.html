<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Красно-чёрное дерево — Интерактивный конструктор</title>
<link rel="stylesheet" href="style.css">


</head>
<body>

<header>
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="opacity:.7">
    <circle cx="10" cy="4" r="3" fill="currentColor"/>
    <circle cx="4" cy="14" r="3" fill="#dc2626"/>
    <circle cx="16" cy="14" r="3" fill="#dc2626"/>
    <line x1="10" y1="7" x2="4" y2="11" stroke="currentColor" stroke-width="1.2"/>
    <line x1="10" y1="7" x2="16" y2="11" stroke="currentColor" stroke-width="1.2"/>
  </svg>
  <h1>Красно-чёрное дерево</h1>
  <span>Интерактивный конструктор · Дискретная математика</span>
</header>

<div class="toolbar">
  <input id="num-input" type="number" placeholder="Введите число…" min="-9999" max="99999"/>
  <button class="primary" onclick="insertNum()">Вставить</button>
  <button onclick="exportTree()">Экспорт JSON ↓</button>
  <button class="danger" onclick="clearTree()">Очистить</button>
  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#dc2626"></span>Красный</div>
    <div class="legend-item"><span class="dot" style="background:var(--black-node);border:1px solid var(--border2)"></span>Чёрный</div>
    <div class="legend-item"><span class="dot" style="background:transparent;border:2.5px solid #f59e0b"></span>Изменён</div>
  </div>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <div id="empty-state">
    <div class="empty-icon">🌳</div>
    <div>Вставьте число, чтобы начать строить дерево</div>
    <div style="font-size:12px;opacity:.6">Enter или кнопка «Вставить»</div>
  </div>
  <svg id="tree-svg" style="display:none"></svg>
</div>

<div class="log-panel" id="log-panel" style="display:none">
  <div class="log-title">Журнал операций</div>
  <div id="log-entries"></div>
</div>

<footer>
  <div id="stats">
    <span>Узлов: <strong id="stat-nodes">0</strong></span>
    <span>Высота: <strong id="stat-height">0</strong></span>
    <span>Красных: <strong id="stat-red">0</strong></span>
    <span>Чёрных: <strong id="stat-black">0</strong></span>
  </div>
</footer>

<script src="./script.js"> </script>
</body>
</html>
